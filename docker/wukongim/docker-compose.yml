# WuKongIM for OMES customer chat. HTTP API only; TCP and WebSocket stay inside the container.
name: omes-wukongim

services:
  wukongim:
    image: registry.cn-shanghai.aliyuncs.com/wukongim/wukongim:v2
    container_name: omes-wukongim
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./wk.yaml:/root/wukongim/wk.yaml:ro
      - wukongim-data:/root/wukongim/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  wukongim-data:
