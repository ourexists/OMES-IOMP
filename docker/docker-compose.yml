# OMES stack: postgres / redis / rabbitmq (+ admin / sas / web via profile "app")
# .\docker.ps1 | ./docker.sh   →  build | up [infra] | down

name: omes

services:
  postgres:
    image: postgres:16-alpine
    container_name: omes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omes}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - omes-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-omes}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - omes-net

  redis:
    image: redis:7-alpine
    container_name: omes-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-waqwertyuiop!}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - omes-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-waqwertyuiop!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - omes-net
  jobmanager:
    image: flink:1.20-java17
    ports:
      - "10018:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
  #      - FLINK_PROPERTIES=jobmanager.memory.process.size=1600m

  taskmanager:
    image: flink:1.20-java17
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: omes-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-TyY6Df3bZe}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - omes-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - omes-net

  admin:
    build:
      context: ..
      dockerfile: docker/admin/Dockerfile
    image: omes-admin:${OMES_IMAGE_TAG:-latest}
    container_name: omes-admin
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${ADMIN_JAVA_OPTS:--Xms512m -Xmx1024m}
    ports:
      - "${ADMIN_PORT:-10010}:10010"
    volumes:
      - ../config:/app/config:ro
      - omes-admin-log:/app/log
    networks:
      - omes-net
    profiles:
      - app

  sas:
    build:
      context: ..
      dockerfile: docker/sas/Dockerfile
    image: omes-sas:${OMES_IMAGE_TAG:-latest}
    container_name: omes-sas
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${SAS_JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "${SAS_PORT:-9400}:9400"
    volumes:
      - ../config:/app/config:ro
      - omes-sas-log:/app/log
    networks:
      - omes-net
    profiles:
      - app

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    image: omes-web:${OMES_IMAGE_TAG:-latest}
    container_name: omes-web
    restart: unless-stopped
    depends_on:
      sas:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - omes-net
    profiles:
      - app

networks:
  omes-net:
    driver: bridge

volumes:
  omes-pg-data:
  omes-redis-data:
  omes-rabbitmq-data:
  omes-admin-log:
  omes-sas-log:
