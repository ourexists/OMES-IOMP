# 静态 SPA。/api 反代 SAS（去掉 /api）；/wkim 反代 WuKongIM（去掉 /wkim）；其余走前端路由
# upstream 用宿主机端口，兼容 Compose / IDEA 单独起 SAS / WuKongIM

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 穿透外层 HTTPS 时透传；未带则回退当前 scheme，避免空 Proto
map $http_x_forwarded_proto $omes_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream omes_sas {
    server host.docker.internal:9400;
    keepalive 32;
}

upstream omes_wukongim {
    server host.docker.internal:5001;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 构建产物
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|map|webmanifest|txt)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # /api/equip/... → SAS /equip/...（后端没有 /api 上下文）
    # 去掉 Origin：浏览器打到 Nginx 已是同源，再带上公网 Origin 会被 Admin CORS 回 403
    location /api/ {
        proxy_pass http://omes_sas/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $omes_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # /wkim/health → WuKongIM /health（宿主机 127.0.0.1:5001，不映射公网端口）
    # 客服窗仍走 /api/im/**；此处供同源直连 WuKongIM HTTP（需其自身 token 鉴权）
    location /wkim/ {
        proxy_pass http://omes_wukongim/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $omes_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
